<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Online</title>
<style>
:root{--bg:#f2efe8;--fg:#1d1d1b;--card:#fff;--bd:#d8d3c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1b19;--fg:#eee;--card:#2a2926;--bd:#444}}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;min-height:100%}
.w{max-width:500px;margin:0 auto;padding:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:20px}
input{font-size:18px;padding:10px;border-radius:8px;border:1px solid var(--bd);width:80%;text-align:center;background:var(--bg);color:var(--fg)}
button{font-size:16px;padding:10px 16px;border-radius:10px;border:0;background:#2f6f4f;color:#fff;margin:4px;cursor:pointer}
button.g{background:#777}
.hide{display:none!important}
#bw{position:relative;width:min(94vw,480px);margin:8px auto}
#bd{display:grid;grid-template-columns:repeat(8,1fr);border:2px solid #333}
.sq{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px);position:relative;user-select:none;cursor:pointer}
.l{background:#eeeed2}.d{background:#769656}
.sq.sel{background:#f6f669!important}.sq.lm{background:#cdd26a!important}
.sq.mv::after{content:"";position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28)}
.sq.ck{background:#e55!important}
.pw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 1px #000}.pb{color:#111}
#ar{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
#st{margin:8px;font-weight:600;min-height:24px}
#gear{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;font-size:24px;padding:0;background:#444;z-index:5}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9}
#md .card{width:min(86vw,340px);margin:0}
#tt{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 14px;border-radius:20px;z-index:20;font-size:14px}
</style></head><body>
<div class="w">
<div id="login" class="card"><h2>♞ Chess Online</h2>
<p>Password daalo</p><input id="pw" type="password" inputmode="numeric" autocomplete="off"><br>
<button id="go">Enter</button><p id="err" style="color:#c33"></p></div>

<div id="lobby" class="card hide"><h3 id="lt"></h3><p id="lp"></p>
<input id="lk" readonly class="hide"><br><button id="cp" class="hide">Copy link</button>
<div id="cc" class="hide"><p>Kaun sa color chahiye?</p>
<button data-c="w">⚪ White</button><button data-c="b">⚫ Black</button><button data-c="r">🎲 Random</button></div></div>

<div id="game" class="hide">
<div id="st"></div>
<div id="bw"><div id="bd"></div>
<svg id="ar" viewBox="0 0 8 8"><defs>
<marker id="mg" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0L4,2L0,4z" fill="#1fa34a"/></marker>
<marker id="mb" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0L4,2L0,4z" fill="#2a74e0"/></marker>
<marker id="mr" markerWidth="4" markerHeight="4" refX="2.4" refY="2" orient="auto"><path d="M0,0L4,2L0,4z" fill="#e03a3a"/></marker>
</defs><g id="ag"></g></svg></div>
<div id="sc" style="margin-top:8px;font-size:14px"></div></div>
</div>
<button id="gear" class="hide">⚙</button>
<div id="md" class="hide"><div class="card"><h3>Settings</h3>
<p id="ms"></p><button id="snd">Sound: ON</button><br>
<button id="rs" class="g">Resign</button><button id="bk" class="g">Back</button><br>
<button id="cl">Close</button></div></div>
<div id="tt" class="hide"></div>

<script>
const $=id=>document.getElementById(id);
const G={P:'♟︎',N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚'};
const V={P:100,N:320,B:330,R:500,Q:900,K:0};
const DB=[[1,1],[1,-1],[-1,1],[-1,-1]],DR=[[1,0],[-1,0],[0,1],[0,-1]],DK=DB.concat(DR);
const DN=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
function init(){const b=Array(64).fill(null),k='RNBQKBNR';for(let c=0;c<8;c++){b[c]='b'+k[c];b[8+c]='bP';b[48+c]='wP';b[56+c]='w'+k[c]}return{b,t:'w',cr:'KQkq',ep:-1,last:null,over:null}}
function att(b,sq,by){const r=sq>>3,c=sq&7,pr=by=='w'?r+1:r-1;
for(const dc of[-1,1]){const cc=c+dc;if(pr>=0&&pr<8&&cc>=0&&cc<8&&b[pr*8+cc]==by+'P')return 1}
for(const[dr,dc]of DN){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==by+'N')return 1}
for(const[dr,dc]of DK){const rr=r+dr,cc=c+dc;if(rr>=0&&rr<8&&cc>=0&&cc<8&&b[rr*8+cc]==by+'K')return 1}
for(const[ds,ks]of[[DB,'B'],[DR,'R']])for(const[dr,dc]of ds){let rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8){const p=b[rr*8+cc];if(p){if(p[0]==by&&(p[1]==ks||p[1]=='Q'))return 1;break}rr+=dr;cc+=dc}}
return 0}
function kp(b,t){return b.indexOf(t+'K')}
function gen(s){const b=s.b,t=s.t,o=t=='w'?'b':'w',ms=[];
for(let i=0;i<64;i++){const p=b[i];if(!p||p[0]!=t)continue;const k=p[1],r=i>>3,c=i&7;
if(k=='P'){const d=t=='w'?-1:1,sr=t=='w'?6:1,pr=t=='w'?0:7,r1=r+d;
if(r1>=0&&r1<8){const f=q=>ms.push({f:i,t:q,pr:r1==pr?1:0});
if(!b[r1*8+c]){f(r1*8+c);if(r==sr&&!b[(r1+d)*8+c])ms.push({f:i,t:(r1+d)*8+c,dp:1})}
for(const dc of[-1,1]){const cc=c+dc;if(cc<0||cc>7)continue;const q=r1*8+cc;if(b[q]&&b[q][0]==o)f(q);else if(q==s.ep)ms.push({f:i,t:q,ep:1})}}continue}
const step=ds=>{for(const[dr,dc]of ds){const rr=r+dr,cc=c+dc;if(rr<0||rr>7||cc<0||cc>7)continue;const q=rr*8+cc;if(!b[q]||b[q][0]==o)ms.push({f:i,t:q})}};
const slide=ds=>{for(const[dr,dc]of ds){let rr=r+dr,cc=c+dc;while(rr>=0&&rr<8&&cc>=0&&cc<8){const q=rr*8+cc;if(!b[q])ms.push({f:i,t:q});else{if(b[q][0]==o)ms.push({f:i,t:q});break}rr+=dr;cc+=dc}}};
if(k=='N')step(DN);else if(k=='B')slide(DB);else if(k=='R')slide(DR);else if(k=='Q')slide(DK);
else{step(DK);if(i==(t=='w'?60:4)&&!att(b,i,o)){const K=t=='w'?'K':'k',Q=t=='w'?'Q':'q';
if(s.cr.includes(K)&&!b[i+1]&&!b[i+2]&&b[i+3]==t+'R'&&!att(b,i+1,o)&&!att(b,i+2,o))ms.push({f:i,t:i+2,cs:1});
if(s.cr.includes(Q)&&!b[i-1]&&!b[i-2]&&!b[i-3]&&b[i-4]==t+'R'&&!att(b,i-1,o)&&!att(b,i-2,o))ms.push({f:i,t:i-2,cs:1})}}}
return ms}
function make(s,m){const b=s.b.slice(),p=b[m.f],t=s.t;let cr=s.cr,ep=-1;
b[m.t]=m.pr?t+'Q':p;b[m.f]=null;
if(m.ep)b[m.t+(t=='w'?8:-8)]=null;
if(m.cs){if(m.t>m.f){b[m.f+1]=b[m.f+3];b[m.f+3]=null}else{b[m.f-1]=b[m.f-4];b[m.f-4]=null}}
if(m.dp)ep=(m.f+m.t)/2;
const rm=x=>{cr=cr.replace(x,'')};
if(p[1]=='K'){if(t=='w'){rm('K');rm('Q')}else{rm('k');rm('q')}}
for(const q of[m.f,m.t]){if(q==63)rm('K');if(q==56)rm('Q');if(q==7)rm('k');if(q==0)rm('q')}
return{b,t:t=='w'?'b':'w',cr,ep,last:[m.f,m.t],over:null}}
function legal(s){return gen(s).filter(m=>{const n=make(s,m);return !att(n.b,kp(n.b,s.t),n.t)})}
function chk(s){return att(s.b,kp(s.b,s.t),s.t=='w'?'b':'w')}
function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const k=p[1],r=i>>3,c=i&7,cen=3.5-Math.max(Math.abs(r-3.5),Math.abs(c-3.5))+.5;
let x=V[k]+(k=='P'?((p[0]=='w'?6-r:r-1)*6+(c>1&&c<6?cen*3:0)):(k=='K'?0:cen*5));v+=p[0]==s.t?x:-x}return v}
function nm(s,d,a,b){const ms=legal(s);if(!ms.length)return chk(s)?-99000-d:0;if(d==0)return ev(s);
ms.sort((x,y)=>(s.b[y.t]?1:0)-(s.b[x.t]?1:0));
for(const m of ms){const v=-nm(make(s,m),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
function suggest(s){const r=legal(s).map(m=>({m,v:-nm(make(s,m),2,-1e6,1e6)}));r.sort((a,b)=>b.v-a.v);return r.slice(0,3).map(x=>x.m)}

let role=null,room=null,S=null,sel=null,lg=[],helper=true,sound=true,sug=[],sugKey='',lastRev=-1,hb=null;
const mine=()=>role=='host'?S.hc:(S.hc=='w'?'b':'w');
function toast(t){const e=$('tt');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),1200)}
function beep(){if(!sound)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=440;g.gain.value=.08;o.start();o.stop(a.currentTime+.08)}catch(e){}}

function connect(code){return new Promise(res=>{const h={};let ws,first=true;
const o={emit:(t,d)=>{if(ws&&ws.readyState==1)ws.send(JSON.stringify({t,d}))},on:(t,f)=>{h[t]=f}};
const open=()=>{ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/?room='+code);
ws.onopen=()=>{if(first){first=false;res(o)}else if(role=='host')o.emit('st',S)};
ws.onmessage=e=>{try{const m=JSON.parse(e.data);h[m.t]&&h[m.t]({isMe:false,data:m.d})}catch(x){}};
ws.onerror=()=>{if(first){first=false;res(null)}};
ws.onclose=()=>setTimeout(open,2000)};open()})}
$('go').onclick=async()=>{const p=$('pw').value.trim(),h=location.hash.replace('#','');
if(p=='80085')role='host';else if(p=='123')role='guest';else{$('err').textContent='Galat password';return}
let code=h;if(role=='guest'&&!code){$('err').textContent='Host ka link kholo';return}
if(role=='host'&&!code)code='g'+Math.random().toString(36).slice(2,7);
$('login').classList.add('hide');$('lobby').classList.remove('hide');
S={...init(),phase:'wait',hc:'w',sc:[0,0],rev:0};
$('lt').textContent=role=='host'?'Host Lobby':'Joining…';
if(role=='host'){const link=location.href.split('#')[0]+'#'+code;$('lk').value=link;$('lk').classList.remove('hide');$('cp').classList.remove('hide');$('lp').textContent='Ye link opponent ko bhejo. Wo password 123 daalega.'}
else $('lp').textContent='Host se connect ho raha hai…';
room=await connect(code);if(!room){$('lp').textContent='Server connect nahi hua, page refresh karo.';return}
room.on('st',m=>{if(m.isMe||!m.data||m.data.rev<S.rev&&role=='host')return;if(role=='guest'||m.data.rev>=S.rev){S=m.data;render()}});
room.on('hi',m=>{if(m.isMe||role!='host')return;if(S.phase=='wait')S.phase='color';push()});
if(role=='guest'){const ping=()=>{if(!(S.rev>0||S.phase!='wait'))room.emit('hi',{})};ping();setInterval(ping,2000)}
else hb=setInterval(()=>room.emit('st',S),3000);
render()};
$('cp').onclick=()=>{$('lk').select();try{navigator.clipboard.writeText($('lk').value)}catch(e){}toast('Copied')};
document.querySelectorAll('#cc button').forEach(b=>b.onclick=()=>{let c=b.dataset.c;if(c=='r')c=Math.random()<.5?'w':'b';
S={...init(),phase:'play',hc:c,sc:S.sc,rev:S.rev+1};push()});
function push(){S.rev++;room&&room.emit('st',S);render()}

function render(){if(!S)return;
if(S.phase!='play'){$('game').classList.add('hide');$('lobby').classList.remove('hide');$('gear').classList.add('hide');
if(role=='host'){$('lt').textContent='Host Lobby';if(S.phase=='color'){$('cc').classList.remove('hide');$('lp').textContent='Opponent aa gaya! Color choose karo.'}}
else{$('lt').textContent='Lobby';$('lp').textContent=S.phase=='color'?'Host color choose kar raha hai…':'Host ka wait…'}return}
$('lobby').classList.add('hide');$('game').classList.remove('hide');$('gear').classList.remove('hide');
if(S.rev!=lastRev){if(lastRev>=0)beep();lastRev=S.rev}
const me=mine(),flip=me=='b',bd=$('bd');bd.innerHTML='';
const ck=!S.over&&chk(S)?kp(S.b,S.t):-1;
for(let v=0;v<64;v++){const i=flip?63-v:v,r=i>>3,c=i&7,p=S.b[i],e=document.createElement('div');
e.className='sq '+((r+c)%2?'d':'l')+(sel==i?' sel':'')+(S.last&&S.last.includes(i)?' lm':'')+(lg.some(m=>m.t==i)?' mv':'')+(i==ck?' ck':'');
if(p){e.innerHTML='<span class="'+(p[0]=='w'?'pw':'pb')+'">'+G[p[1]]+'</span>'}
e.onclick=()=>tap(i);bd.appendChild(e)}
let t='';const o=S.over;
if(o){t=o.r=='mate'?(o.w==me?'🏆 Checkmate! Tum jeete':'Checkmate. Tum haar gaye'):o.r=='resign'?(o.w==me?'🏆 Opponent ne resign kiya':'Tumne resign kiya'):'Draw (stalemate)';
if(role=='host')t+=' ';}
else t=(S.t==me?'Teri baari':'Opponent ki baari')+(ck>=0?' — CHECK!':'');
$('st').textContent=t;
const my=role=='host'?S.sc[0]:S.sc[1],op=role=='host'?S.sc[1]:S.sc[0];
$('sc').textContent='Score — Tum: '+my+'  |  Opponent: '+op;
if(o&&role=='host'){const b=document.createElement('button');b.textContent='Next game';b.onclick=()=>{S={...init(),phase:'color',hc:S.hc,sc:S.sc,rev:S.rev};$('cc').classList.remove('hide');push()};$('st').appendChild(b)}
if(o&&role=='guest'){}
drawAr()}

function drawAr(){const g=$('ag');g.innerHTML='';
if(role!='host'||!helper||S.over||S.t!=S.hc)return;
const key=S.b.join()+S.t+S.rev;
if(key!=sugKey){sugKey=key;sug=[];setTimeout(()=>{if(sugKey==key){sug=suggest(S);drawAr()}},30);return}
const flip=S.hc=='b',pt=i=>{const r=i>>3,c=i&7;return flip?[7-c+.5,7-r+.5]:[c+.5,r+.5]};
const cols=[['#1fa34a','mg'],['#2a74e0','mb'],['#e03a3a','mr']];
sug.forEach((m,k)=>{const a=pt(m.f),b=pt(m.t),dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;
const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
ln.setAttribute('x1',a[0]);ln.setAttribute('y1',a[1]);ln.setAttribute('x2',b[0]-dx/L*.3);ln.setAttribute('y2',b[1]-dy/L*.3);
ln.setAttribute('stroke',cols[k][0]);ln.setAttribute('stroke-width',.13);ln.setAttribute('opacity',.85);ln.setAttribute('marker-end','url(#'+cols[k][1]+')');g.appendChild(ln)})}

function tap(i){if(!S||S.over||S.t!=mine())return;const p=S.b[i];
if(sel!=null){const m=lg.find(x=>x.t==i);if(m){doMove(m);return}}
if(p&&p[0]==S.t){sel=i;lg=legal(S).filter(m=>m.f==i)}else{sel=null;lg=[]}render()}
function doMove(m){const n=make(S,m),ms=legal(n);sel=null;lg=[];
const nx={...n,phase:'play',hc:S.hc,sc:S.sc.slice(),rev:S.rev};
if(!ms.length){if(chk(n)){nx.over={r:'mate',w:S.t};nx.sc[S.t==S.hc?0:1]++}else nx.over={r:'stale',w:null}}
S=nx;push()}

let lastTap=0,tmr=null;
$('gear').onclick=()=>{const now=Date.now();
if(role!='host'){openM();return}
if(now-lastTap<420){clearTimeout(tmr);lastTap=0;helper=!helper;sugKey='';toast(helper?'✓':'–');render();return}
lastTap=now;tmr=setTimeout(()=>{lastTap=0;openM()},430)};
function openM(){$('ms').textContent=$('sc').textContent;$('md').classList.remove('hide')}
$('cl').onclick=()=>$('md').classList.add('hide');
$('snd').onclick=()=>{sound=!sound;$('snd').textContent='Sound: '+(sound?'ON':'OFF')};
$('bk').onclick=()=>location.reload();
$('rs').onclick=()=>{if(!S||S.over||S.phase!='play')return;const me=mine(),w=me=='w'?'b':'w';
S={...S,over:{r:'resign',w},sc:S.sc.slice()};S.sc[w==S.hc?0:1]++;$('md').classList.add('hide');push()};
</script></body></html>
